[env:featheresp32-s2]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps = miguelbalboa/MFRC522@^1.4.12
           LittleFS @ ^2.0.0
